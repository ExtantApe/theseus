name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Private terms for the leak check
        env:
          TERMS: ${{ secrets.LEAK_TERMS }}
        run: if [ -n "$TERMS" ]; then printf '%s\n' "$TERMS" > "$HOME/.theseus-private-terms"; fi
      - run: bash scripts/ci-checks.sh
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter theseus-desktop build
      - run: pnpm exec playwright install webkit
      - run: pnpm --filter theseus-desktop e2e
      - run: WALL_BROWSER=webkit node apps/wall/e2e.mjs
      - run: pnpm --filter theseus-desktop tauri build --no-bundle
