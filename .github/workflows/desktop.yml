# Theseus for Mac: on a desktop-v* tag, check the tag matches the app's version, build a universal (Apple silicon + Intel) app,
# and publish it as a GitHub release. To release: see RELEASING.md.
# Unsigned by choice (Apple charges for signing); the README explains the first launch.
name: Desktop app

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag must match the app's version
        run: |
          want="desktop-v$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "Tag $GITHUB_REF_NAME doesn't match version ($want)"; exit 1; }
      - run: bash scripts/ci-checks.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Theseus for Mac ${{ github.ref_name }}'
          releaseBody: 'Download the .dmg and drag Theseus to Applications. It is unsigned, so see the README for how to allow the first launch: xattr -dr com.apple.quarantine "/Applications/Theseus.app"'
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
